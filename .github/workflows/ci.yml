name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.9 mypy==2.3.1 coverage==7.16.2
      - run: ruff check effectlock tests
      - run: mypy
      - run: coverage run -m unittest discover -s tests
      - run: coverage report -m
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q effectlock
      - name: Offline installer smoke
        run: |
          export HOME="$RUNNER_TEMP/effectlock-home"
          mkdir -p "$HOME"
          ./install.sh
          "$HOME/.local/bin/effectlock" --version
          "$HOME/.local/bin/effectlock" -- "npm install" | grep "effects: process, file, network"
