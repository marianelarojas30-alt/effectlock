name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q effectlock
      - name: Offline installer smoke
        run: |
          export HOME="$RUNNER_TEMP/effectlock-home"
          mkdir -p "$HOME"
          ./install.sh
          "$HOME/.local/bin/effectlock" --version
          "$HOME/.local/bin/effectlock" -- "npm install" | grep "effects: process, file, network"
