name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q effectlock
      - name: Offline installer smoke
        run: |
          export HOME="$RUNNER_TEMP/effectlock-home"
          mkdir -p "$HOME"
          ./install.sh
          "$HOME/.local/bin/effectlock" --version
          "$HOME/.local/bin/effectlock" -- "npm install" | grep "effects: process, file, network"
