[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "effectlock"
version = "0.2.0"
description = "Local transitive-effect preflight for developer commands and coding-agent approvals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EffectLock contributors"}]
dependencies = []

[project.scripts]
effectlock = "effectlock.cli:main"

[tool.setuptools.packages.find]
include = ["effectlock*"]
