[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "effectlock"
version = "0.2.1"
description = "Local transitive-effect preflight for developer commands and coding-agent approvals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Marianela Bourgault"}]
dependencies = []

[project.scripts]
effectlock = "effectlock.cli:main"

[tool.setuptools.packages.find]
include = ["effectlock*"]

[tool.ruff]
target-version = "py310"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.mypy]
strict = true
files = ["effectlock"]

[tool.coverage.run]
branch = true
source = ["effectlock"]

[tool.coverage.report]
fail_under = 85
